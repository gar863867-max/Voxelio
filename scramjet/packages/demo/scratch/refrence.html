<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sparx Maths</title>
	<link rel="icon" href="https://intercom-help.eu/sparx-maths-help-centre/assets/favicon" type="image/x-icon">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
		rel="stylesheet">
	<script src="https://intelligent-dedication-production-f8d8.up.railway.app/scramjet/scramjet.js"></script>
	<script src="https://intelligent-dedication-production-f8d8.up.railway.app/controller/controller.api.js"></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box
		}

		:root {
			--bg: #000;
			--bg2: #080808;
			--bg3: #111;
			--card: rgba(255, 255, 255, 0.03);
			--border: rgba(255, 255, 255, 0.07);
			--t1: #fff;
			--t2: #999;
			--t3: #555;
			--r: 14px;
			--tr: cubic-bezier(.4, 0, .2, 1);
			--glass-bg: rgba(255, 255, 255, 0.05);
			--glass-border: rgba(255, 255, 255, 0.1);
		}

		body {
			font-family: 'Inter', system-ui, sans-serif;
			background: var(--bg);
			color: var(--t1);
			min-height: 100vh;
			overflow-x: hidden;
			-webkit-font-smoothing: antialiased;
			transition: background 0.5s ease;
		}

		body.liquid-glass {
			--bg: rgba(20, 20, 30, 0.6);
			--bg2: rgba(30, 30, 40, 0.5);
			--bg3: rgba(40, 40, 55, 0.4);
			--card: rgba(255, 255, 255, 0.06);
			--border: rgba(255, 255, 255, 0.12);
			background: linear-gradient(135deg, #1a1a2e 0%, #16213e 25%, #0f3460 50%, #16213e 75%, #1a1a2e 100%);
			background-size: 400% 400%;
			animation: gradientShift 15s ease infinite;
		}

		@keyframes gradientShift {
			0% {
				background-position: 0% 50%;
			}

			50% {
				background-position: 100% 50%;
			}

			100% {
				background-position: 0% 50%;
			}
		}

		body.liquid-glass::before {
			content: '';
			position: fixed;
			top: -50%;
			left: -50%;
			width: 200%;
			height: 200%;
			background: radial-gradient(circle at 30% 20%, rgba(120, 100, 255, 0.1), transparent 50%),
				radial-gradient(circle at 70% 60%, rgba(255, 100, 150, 0.08), transparent 50%),
				radial-gradient(circle at 50% 50%, rgba(100, 200, 255, 0.06), transparent 50%);
			pointer-events: none;
			z-index: -1;
			animation: liquidMove 20s ease-in-out infinite;
		}

		@keyframes liquidMove {

			0%,
			100% {
				transform: translate(0, 0) rotate(0deg);
			}

			25% {
				transform: translate(2%, -1%) rotate(2deg);
			}

			50% {
				transform: translate(-1%, 1%) rotate(-1deg);
			}

			75% {
				transform: translate(1%, 2%) rotate(1deg);
			}
		}

		body.liquid-glass .card,
		body.liquid-glass .cloud-game-card {
			backdrop-filter: blur(20px) saturate(180%);
			-webkit-backdrop-filter: blur(20px) saturate(180%);
			background: rgba(255, 255, 255, 0.06);
			border: 1px solid rgba(255, 255, 255, 0.1);
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.05);
		}

		body.liquid-glass .card:hover,
		body.liquid-glass .cloud-game-card:hover {
			background: rgba(255, 255, 255, 0.1);
			border-color: rgba(255, 255, 255, 0.2);
			box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.08);
		}

		body.liquid-glass .tabs {
			backdrop-filter: blur(20px) saturate(180%);
			-webkit-backdrop-filter: blur(20px) saturate(180%);
			background: rgba(30, 30, 50, 0.5);
		}

		body.liquid-glass .modal-overlay {
			background: rgba(0, 0, 0, 0.7);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
		}

		body.liquid-glass .modal-box {
			backdrop-filter: blur(25px) saturate(200%);
			-webkit-backdrop-filter: blur(25px) saturate(200%);
			background: rgba(30, 30, 50, 0.7);
			border: 1px solid rgba(255, 255, 255, 0.15);
		}

		::-webkit-scrollbar {
			width: 5px
		}

		::-webkit-scrollbar-track {
			background: transparent
		}

		::-webkit-scrollbar-thumb {
			background: rgba(255, 255, 255, .15);
			border-radius: 9px
		}

		/* Tab Bar */
		.tabs {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 100;
			display: flex;
			gap: 0;
			background: rgba(0, 0, 0, .85);
			backdrop-filter: blur(20px);
			border-bottom: 1px solid var(--border);
			padding: 0 12px;
			height: 44px;
			align-items: stretch;
			overflow-x: auto;
			scrollbar-width: none;
		}

		.tabs::-webkit-scrollbar {
			display: none;
		}

		.tab {
			background: 0;
			border: 0;
			color: var(--t3);
			font: 500 .8rem/1 'Inter', sans-serif;
			padding: 0 12px;
			cursor: pointer;
			position: relative;
			transition: color .25s;
			white-space: nowrap;
		}

		.tab:hover {
			color: var(--t2)
		}

		.tab.active {
			color: #fff
		}

		.tab.active::after {
			content: '';
			position: absolute;
			bottom: 0;
			left: 8px;
			right: 8px;
			height: 2px;
			background: #fff;
			border-radius: 2px 2px 0 0;
			animation: tabIn .25s var(--tr)
		}

		@keyframes tabIn {
			from {
				transform: scaleX(0)
			}

			to {
				transform: scaleX(1)
			}
		}

		.theme-badge {
			position: absolute;
			top: 2px;
			right: 4px;
			font-size: 0.5rem;
			color: var(--t3);
			opacity: 0;
			transition: opacity 0.3s;
		}

		body.liquid-glass .theme-badge {
			opacity: 1;
			color: rgba(255, 255, 255, 0.5);
		}

		/* Panels */
		.panel {
			display: none;
			padding: 64px 20px 30px;
			min-height: 100vh;
			animation: fadeUp .4s var(--tr)
		}

		.panel.active {
			display: block
		}

		@keyframes fadeUp {
			from {
				opacity: 0;
				transform: translateY(16px)
			}

			to {
				opacity: 1;
				transform: translateY(0)
			}
		}

		/* Home */
		.home-center {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 80vh;
			gap: 24px;
			text-align: center
		}

		.brand {
			font-size: clamp(3rem, 8vw, 5rem);
			font-weight: 900;
			letter-spacing: -.04em;
			background: linear-gradient(135deg, #fff 0%, #888 50%, #fff 100%);
			background-size: 200% 200%;
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			animation: shimmer 4s ease infinite
		}

		@keyframes shimmer {

			0%,
			100% {
				background-position: 0% 50%
			}

			50% {
				background-position: 100% 50%
			}
		}

		.sub {
			color: var(--t3);
			font-size: .9rem;
			letter-spacing: .1em;
			text-transform: uppercase;
			font-weight: 500
		}

		.search-box {
			width: min(520px, 90vw);
			position: relative
		}

		.search-box input {
			width: 100%;
			padding: 14px 20px 14px 44px;
			border-radius: 40px;
			border: 1px solid var(--border);
			background: var(--card);
			color: #fff;
			font: 400 .95rem/1 'Inter', sans-serif;
			outline: 0;
			transition: all .3s var(--tr)
		}

		.search-box input:focus {
			border-color: rgba(255, 255, 255, .2);
			box-shadow: 0 0 0 4px rgba(255, 255, 255, .03), 0 8px 32px rgba(0, 0, 0, .5)
		}

		.search-box input::placeholder {
			color: var(--t3)
		}

		.search-box svg {
			position: absolute;
			left: 16px;
			top: 50%;
			transform: translateY(-50%);
			color: var(--t3);
			pointer-events: none
		}

		.cat-btns {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			justify-content: center;
			margin-top: 8px
		}

		.cat-btn {
			padding: 10px 24px;
			border-radius: 40px;
			border: 1px solid var(--border);
			background: var(--card);
			color: var(--t2);
			font: 500 .85rem/1 'Inter', sans-serif;
			cursor: pointer;
			transition: all .3s var(--tr)
		}

		.cat-btn:hover {
			background: rgba(255, 255, 255, .08);
			color: #fff;
			border-color: rgba(255, 255, 255, .15);
			transform: translateY(-2px)
		}

		.cat-btn:active {
			transform: scale(.97)
		}

		.home-footer {
			color: var(--t3);
			font-size: .7rem;
			letter-spacing: .05em;
			text-transform: uppercase;
			margin-top: 16px
		}

		.blank-btn {
			padding: 12px 28px;
			border-radius: 40px;
			border: 1px solid var(--border);
			background: rgba(255, 255, 255, .05);
			color: #fff;
			font: 600 .9rem/1 'Inter', sans-serif;
			cursor: pointer;
			transition: all .3s var(--tr);
			margin-top: 8px
		}

		.blank-btn:hover {
			background: rgba(255, 255, 255, .1);
			transform: translateY(-2px);
			box-shadow: 0 8px 24px rgba(0, 0, 0, .5)
		}

		/* Cards */
		.grid {
			display: flex;
			flex-wrap: wrap;
			gap: 14px;
			justify-content: center;
			max-width: 1300px;
			margin: 20px auto
		}

		.card {
			width: 160px;
			background: var(--card);
			padding: 16px 12px;
			border-radius: var(--r);
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
			border: 1px solid var(--border);
			cursor: pointer;
			transition: all .35s var(--tr);
			position: relative;
			overflow: hidden
		}

		.card::before {
			content: '';
			position: absolute;
			inset: 0;
			background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, .06), transparent 70%);
			opacity: 0;
			transition: opacity .35s
		}

		.card:hover {
			transform: translateY(-6px) scale(1.02);
			border-color: rgba(255, 255, 255, .15);
			box-shadow: 0 16px 40px rgba(0, 0, 0, .6)
		}

		.card:hover::before {
			opacity: 1
		}

		.card img {
			width: 64px;
			height: 64px;
			border-radius: 12px;
			margin-bottom: 10px;
			box-shadow: 0 4px 12px rgba(0, 0, 0, .5);
			transition: transform .35s var(--tr)
		}

		.card:hover img {
			transform: scale(1.06)
		}

		.card span {
			font: 600 .85rem/1.3 'Inter', sans-serif;
			color: var(--t1)
		}

		/* Cloud Game Cards */
		.cloud-game-card {
			width: 180px;
			background: var(--card);
			border-radius: var(--r);
			overflow: hidden;
			border: 1px solid var(--border);
			cursor: pointer;
			transition: all .35s var(--tr);
			position: relative;
		}

		.cloud-game-card:hover {
			transform: translateY(-6px) scale(1.02);
			border-color: rgba(255, 255, 255, .15);
			box-shadow: 0 16px 40px rgba(0, 0, 0, .6)
		}

		.cloud-game-card img {
			width: 100%;
			height: 240px;
			object-fit: cover;
			display: block;
		}

		.cloud-game-title {
			padding: 12px;
			font: 600 .85rem/1.3 'Inter', sans-serif;
			color: var(--t1);
			text-align: center;
			background: var(--bg2);
		}

		.cloud-search {
			width: 100%;
			max-width: 500px;
			margin: 0 auto 20px;
			position: relative;
		}

		.cloud-search input {
			width: 100%;
			padding: 12px 20px 12px 40px;
			border-radius: 30px;
			border: 1px solid var(--border);
			background: var(--card);
			color: #fff;
			font: 400 .9rem/1 'Inter', sans-serif;
			outline: 0;
			transition: all .3s var(--tr);
		}

		.cloud-search input:focus {
			border-color: rgba(255, 255, 255, .2);
			box-shadow: 0 0 0 3px rgba(255, 255, 255, .03);
		}

		.cloud-search input::placeholder {
			color: var(--t3);
		}

		.cloud-search svg {
			position: absolute;
			left: 14px;
			top: 50%;
			transform: translateY(-50%);
			color: var(--t3);
			pointer-events: none;
		}

		.back-btn {
			padding: 10px 24px;
			border-radius: 30px;
			border: 1px solid var(--border);
			background: var(--card);
			color: var(--t2);
			font: 500 .85rem/1 'Inter', sans-serif;
			cursor: pointer;
			transition: all .3s;
			margin-bottom: 16px;
			display: inline-block
		}

		.back-btn:hover {
			color: #fff;
			border-color: rgba(255, 255, 255, .15);
			transform: translateY(-2px)
		}

		.section-title {
			font: 700 1.5rem/1 'Inter', sans-serif;
			margin-bottom: 16px;
			color: #fff
		}

		.cloud-count {
			color: var(--t3);
			font-size: .8rem;
			margin-bottom: 16px;
			text-align: center;
		}

		/* Game Window */
		#game-window {
			display: none;
			flex-direction: column;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			z-index: 9999;
			padding: 24px;
			background: rgba(10, 10, 10, 0.98);
			backdrop-filter: blur(20px);
			animation: fadeUp .3s var(--tr);
		}

		#game-title {
			text-align: center;
			font-size: 1.5rem;
			font-weight: 700;
		}

		#game-window iframe {
			flex: 1;
			width: 100%;
			max-width: 1400px;
			margin: 0 auto;
			border: 1px solid var(--border);
			border-radius: 12px;
			background: #000;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
		}

		.g-controls {
			display: flex;
			gap: 8px;
			margin-top: 14px;
			flex-wrap: wrap;
			justify-content: center;
			align-items: center;
		}

		.g-controls button {
			padding: 9px 20px;
			border-radius: 30px;
			border: 1px solid var(--border);
			background: var(--card);
			color: var(--t2);
			font: 500 .82rem/1 'Inter', sans-serif;
			cursor: pointer;
			transition: all .3s
		}

		.g-controls button:hover {
			color: #fff;
			border-color: rgba(255, 255, 255, .15);
			background: rgba(255, 255, 255, .06)
		}

		/* Modal Overlay */
		.modal-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.8);
			z-index: 10001;
			justify-content: center;
			align-items: center;
			animation: fadeIn .2s ease;
		}

		.modal-overlay.active {
			display: flex;
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
			}

			to {
				opacity: 1;
			}
		}

		.modal-box {
			background: #1a1a1a;
			border-radius: 20px;
			padding: 32px 28px;
			max-width: 460px;
			width: 92%;
			text-align: center;
			border: 1px solid rgba(255, 255, 255, 0.1);
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
			animation: modalPop .35s cubic-bezier(.4, 0, .2, 1);
		}

		@keyframes modalPop {
			from {
				transform: scale(0.92);
				opacity: 0;
			}

			to {
				transform: scale(1);
				opacity: 1;
			}
		}

		.modal-box .modal-game-img {
			width: 100%;
			height: 140px;
			object-fit: cover;
			border-radius: 12px;
			margin-bottom: 16px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
		}

		.modal-box h2 {
			font-size: 1.2rem;
			font-weight: 700;
			color: #fff;
			margin-bottom: 6px;
		}

		.modal-box .modal-game-name {
			font-size: 0.85rem;
			color: #888;
			margin-bottom: 20px;
		}

		.modal-buttons {
			display: flex;
			gap: 12px;
			justify-content: center;
			flex-wrap: wrap;
		}

		.btn-modal {
			flex: 1;
			min-width: 140px;
			padding: 14px 20px;
			border-radius: 14px;
			font: 600 0.9rem/1 'Inter', sans-serif;
			cursor: pointer;
			transition: all 0.25s ease;
			border: none;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
		}

		.btn-modal-white {
			background: #fff;
			color: #000;
		}

		.btn-modal-white:hover {
			background: #e5e5e5;
			transform: translateY(-2px);
			box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
		}

		.btn-modal-dark {
			background: #1a1a1a;
			color: #fff;
			border: 1px solid rgba(255, 255, 255, 0.2);
		}

		.btn-modal-dark:hover {
			background: #252525;
			border-color: rgba(255, 255, 255, 0.35);
			transform: translateY(-2px);
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
		}

		.btn-modal:active {
			transform: scale(0.97);
		}

		/* Proxy Notice */
		.proxy-notice {
			position: fixed;
			top: 60px;
			left: 50%;
			transform: translateX(-50%);
			background: rgba(108, 92, 231, 0.9);
			color: white;
			padding: 10px 24px;
			border-radius: 25px;
			z-index: 999;
			font-size: 0.85rem;
			animation: slideDown 0.3s ease;
			display: none;
			align-items: center;
			gap: 8px;
		}

		.proxy-notice.visible {
			display: flex;
		}

		@keyframes slideDown {
			from {
				opacity: 0;
				transform: translateX(-50%) translateY(-20px);
			}

			to {
				opacity: 1;
				transform: translateX(-50%) translateY(0);
			}
		}

		/* Proxy */
		.proxy-bar {
			display: flex;
			gap: 8px;
			width: 100%;
			max-width: 1400px;
			margin: 0 auto 16px;
			align-items: center
		}

		.proxy-bar input {
			flex: 1;
			padding: 12px 18px;
			border-radius: 10px;
			border: 1px solid var(--border);
			background: var(--card);
			color: #fff;
			font: .9rem 'Inter', sans-serif;
			outline: 0;
			transition: all .3s
		}

		.proxy-bar input:focus {
			border-color: rgba(255, 255, 255, .2);
			box-shadow: 0 0 0 3px rgba(255, 255, 255, .03)
		}

		.proxy-bar button {
			padding: 12px 24px;
			border-radius: 10px;
			border: 0;
			background: #fff;
			color: #000;
			font: 600 .85rem/1 'Inter', sans-serif;
			cursor: pointer;
			transition: all .2s
		}

		.proxy-bar button:hover {
			background: #ddd;
			transform: translateY(-1px)
		}

		.proxy-nav {
			display: flex;
			gap: 4px;
			width: 100%;
			max-width: 1400px;
			margin: 0 auto 12px
		}

		.proxy-nav button {
			width: 34px;
			height: 34px;
			border-radius: 8px;
			border: 1px solid var(--border);
			background: var(--card);
			color: var(--t3);
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all .2s;
			font-size: 1.1rem;
			padding: 0
		}

		.proxy-nav button:hover {
			color: #fff;
			background: rgba(255, 255, 255, .06)
		}

		/* Browser Tabs */
		.browser-tabs-container {
			display: flex;
			align-items: center;
			width: 100%;
			max-width: 1400px;
			margin: 0 auto 12px;
			background: var(--bg2);
			border-radius: 12px 12px 0 0;
			padding: 8px 8px 0;
			border: 1px solid var(--border);
			border-bottom: none;
		}

		.browser-tabs {
			display: flex;
			flex: 1;
			overflow-x: auto;
			scrollbar-width: none;
		}

		.browser-tabs::-webkit-scrollbar {

function searchWeb() {
    let url = document.getElementById('search-bar').value.trim();
    if (!url) return;

    if (!/^https?:\/\//i.test(url)) {
        if (url.includes('.')) {
            url = 'https://' + url;
        } else {
            url = 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
        }
    }

    showTab('proxy');

    const wait = () => {
        if (proxyReady && ctrlInstance) {
            addBrowserTab();

            const tab = browserTabs[browserTabs.length - 1];

            // 🔥 IMPORTANT: wait until frame exists
            const ensureFrame = () => {
                if (tab.frame) {
                    tab.frame.go(url);
                    tab.url = url;
                    tab.title = url;
                    switchBrowserTab(tab.id);
                    renderBrowserTabs();
                } else {
                    setTimeout(ensureFrame, 50);
                }
            };

            ensureFrame();
        } else {
            setTimeout(wait, 100);
        }
    };

    wait();
}

				// Build message for display
				addMsgWithImage(msg || '', 'user', pendingImageData, pendingImageType);

				// Build content for API
				const userContent = [
					{ type: 'image_url', image_url: { url: `data:${pendingImageType};base64,${pendingImageData}` } },
					{ type: 'text', text: msg || '' }
				];
				chatHist.push({ role: 'user', content: userContent });

				// Clear pending image
				removePendingImage();
			} else {
				// Text-only message
				addMsg(msg, 'user');
				chatHist.push({ role: 'user', content: msg });
			}

			try {
				const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'HTTP-Referer': window.location.origin,
						'X-Title': 'Quantum AI Chat',
						'Authorization': 'Bearer ' + OPENROUTER_API_KEY
					},
					body: JSON.stringify({ model: currentModel.id, messages: chatHist, max_tokens: 2048, temperature: 0.7 })
				});
				const data = await response.json();
				if (data.error) throw new Error(data.error.message || 'API Error');
				if (data.choices?.[0]) {
					const reply = data.choices[0].message.content;
					chatHist.push({ role: 'assistant', content: reply });
					addMsg(reply, 'ai');
				}
			} catch (e) {
				addMsg('Error: ' + e.message, 'ai err');
			}
		}

		function addMsg(t, cls) {
			const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = t;
			const c = document.getElementById('chat-msgs'); c.appendChild(d); c.scrollTop = c.scrollHeight;
		}

		function addMsgWithImage(text, cls, imageData, imageType) {
			const d = document.createElement('div');
			d.className = 'msg ' + cls;
			const img = document.createElement('img');
			img.src = `data:${imageType};base64,${imageData}`;
			img.className = 'msg-image';
			d.appendChild(img);
			if (text) {
				const span = document.createElement('span');
				span.textContent = text;
				d.appendChild(span);
			}
			const c = document.getElementById('chat-msgs'); c.appendChild(d); c.scrollTop = c.scrollHeight;
		}

		// Proxy variables (shared)
		let proxyReady = false, ctrlInstance = null, proxyFrame = null;
		let browserTabs = [{ id: 'tab-1', url: '', title: 'New Tab', frame: null, icon: null }];
		let activeBrowserTabId = 'tab-1';
		let tabCounter = 1;

		function renderBrowserTabs() {
			const container = document.getElementById('browser-tabs');
			container.innerHTML = '';
			browserTabs.forEach(tab => {
				const isActive = tab.id === activeBrowserTabId ? 'active' : '';
				let icon = tab.icon || (tab.url ? (new URL(tab.url).origin + '/favicon.ico') : 'https://duckduckgo.com/favicon.ico');
				container.innerHTML += `<div class="browser-tab ${isActive}" onclick="switchBrowserTab('${tab.id}')">
                    <img src="${icon}" class="b-tab-icon" onerror="this.src='https://duckduckgo.com/favicon.ico'">
                    <span class="b-tab-title">${tab.title}</span>
                    <div class="b-tab-close" onclick="closeBrowserTab(event, '${tab.id}')">×</div>
                </div>`;
			});
		}

		function switchBrowserTab(id) {
			activeBrowserTabId = id;
			renderBrowserTabs();
			document.querySelectorAll('.proxy-frame-wrap').forEach(w => w.classList.remove('active'));
			const activeWrap = document.getElementById('frame-wrap-' + id);
			if (activeWrap) activeWrap.classList.add('active');
			const activeTab = browserTabs.find(t => t.id === id);
			if (activeTab) {
				document.getElementById('proxy-url').value = activeTab.url || '';
				proxyFrame = activeTab.frame;
			}
		}

		function addBrowserTab() {
			tabCounter++;
			const newId = 'tab-' + tabCounter;
			browserTabs.push({ id: newId, url: '', title: 'New Tab', frame: null, icon: null });
			const container = document.getElementById('proxy-frames-container');
			const wrap = document.createElement('div');
			wrap.className = 'proxy-frame-wrap';
			wrap.id = 'frame-wrap-' + newId;
			wrap.innerHTML = `<iframe id="proxy-frame-${newId}"></iframe>`;
			container.appendChild(wrap);
			if (proxyReady && ctrlInstance) {
				const frameEl = document.getElementById('proxy-frame-' + newId);
				const newFrame = ctrlInstance.createFrame(frameEl);
				const t = browserTabs.find(tab => tab.id === newId);
				if (t) { t.frame = newFrame; t.url = 'https://duckduckgo.com'; t.title = 'Loading...'; newFrame.go(t.url); }
			}
			switchBrowserTab(newId);
		}

		function closeBrowserTab(e, id) {
			e.stopPropagation();
			if (browserTabs.length <= 1) return;
			const idx = browserTabs.findIndex(t => t.id === id);
			browserTabs.splice(idx, 1);
			const wrap = document.getElementById('frame-wrap-' + id);
			if (wrap) wrap.remove();
			if (activeBrowserTabId === id) switchBrowserTab(browserTabs[Math.max(0, idx - 1)].id);
			else renderBrowserTabs();
		}

		async function initProxy() {
			if (proxyReady) return;
			try {
				const reg = await navigator.serviceWorker.register('https://intelligent-dedication-production-f8d8.up.railway.app/sw.js');
				const sw = navigator.serviceWorker.controller || reg.active;
				if (!sw) { await navigator.serviceWorker.ready; await new Promise(r => { navigator.serviceWorker.addEventListener('controllerchange', r, { once: true }) }); }
				while (!window.LibcurlClient) { await new Promise(r => setTimeout(r, 50)); }
				const { Controller } = $scramjetController;
				const wispUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + 'intelligent-dedication-production-f8d8.up.railway.app/wisp/';
				const ctrl = new Controller({ serviceworker: navigator.serviceWorker.controller || (await navigator.serviceWorker.ready).active, transport: new window.LibcurlClient({ wisp: wispUrl }), scramjetConfig: window.defaultConfigDev });
				await ctrl.wait();
				ctrlInstance = ctrl;
				proxyFrame = ctrl.createFrame(document.getElementById('proxy-frame-tab-1'));
				browserTabs[0].frame = proxyFrame;
				browserTabs[0].url = 'https://duckduckgo.com';
				browserTabs[0].title = 'Loading...';
				proxyFrame.go(browserTabs[0].url);
				proxyReady = true;
			} catch (e) { console.error(e); }
		}
		initProxy();

		function proxyNav() {
			if (!proxyReady) { toast('Proxy not ready'); return }
			const input = document.getElementById('proxy-url');
			let v = input.value.trim(); if (!v) return;
			if (!/^https?:\/\//.test(v) && !/\.\w{2,}/.test(v)) v = 'https://duckduckgo.com/?q=' + encodeURIComponent(v);
			else if (!/^https?:\/\//.test(v)) v = 'https://' + v;
			input.value = v;
			const activeTab = browserTabs.find(t => t.id === activeBrowserTabId);
			if (activeTab?.frame) { activeTab.frame.go(v); activeTab.url = v; activeTab.title = 'Loading...'; renderBrowserTabs(); }
		}
		function proxyBack() { proxyFrame?.back() }
		function proxyFwd() { proxyFrame?.forward() }
		function proxyReload() { proxyFrame?.reload() }
		function proxyFullscreen() {
			const container = document.getElementById('proxy-frames-container');
			if (container.requestFullscreen) container.requestFullscreen();
		}

		// Init
		initModelSelect();
		renderCloudGames();
	</script>
	<script src="gamedata.js"></script>
	<script>
		renderItems('games-container', games);
		renderItems('apps-container', apps);
		renderItems('flash-container', flashGames);
		renderItems('unblockers-container', unblockers);
	</script>
</body>
